<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForensicSuite Dashboard</title>
<script src="chart.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0a0f1a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  .bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(212,175,55,0.10), rgba(0,0,0,0.85)),
                url('assets/logo-bg.png') center center / contain no-repeat;
    opacity: 0.24;
    pointer-events: none;
    z-index: 0;
  }
  .fallback-logo {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
    color: #d4af37;
    font-family: Georgia, serif;
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    letter-spacing: 8px;
    opacity: 0.13;
    text-shadow: 0 0 60px rgba(212,175,55,0.25);
  }
  .fallback-logo .big { font-size: clamp(64px, 14vw, 160px); }
  .fallback-logo .small { display:block; font-size: clamp(20px, 4vw, 42px); margin-top: 10px; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  header {
    text-align: center;
    padding: 24px 0 18px;
    border-bottom: 1px solid rgba(148,163,184,0.18);
    margin-bottom: 18px;
  }
  header h1 {
    margin: 0;
    font-size: 2rem;
    color: #60a5fa;
  }
  header p {
    margin: 6px 0 0;
    color: #94a3b8;
    font-size: 0.95rem;
  }

  .langbar {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 14px 0 18px;
  }
  .langbar button {
    border: 1px solid rgba(148,163,184,0.18);
    background: rgba(30,41,59,0.9);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
  }
  .langbar button.active {
    background: #2563eb;
    border-color: #60a5fa;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 0 0 18px;
  }
  .toolbar button {
    border: 1px solid rgba(148,163,184,0.18);
    background: rgba(30,41,59,0.9);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
  }
  .toolbar .primary { background: #2563eb; }
  .toolbar .success { background: #16a34a; }
  .toolbar .warning { background: #d97706; }
  .toolbar .danger { background: #dc2626; }
  .toolbar .info { background: #0891b2; }

  .panel {
    background: rgba(15,23,42,0.88);
    border: 1px solid rgba(148,163,184,0.14);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .score-card {
    background: rgba(30,41,59,0.85);
    border: 1px solid rgba(148,163,184,0.10);
    border-radius: 14px;
    padding: 18px;
  }
  .score-card h3 {
    margin: 0 0 10px;
    color: #94a3b8;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .score-value { font-size: 2.5rem; font-weight: 800; line-height: 1; }
  .good { color: #4ade80; }
  .warn { color: #fbbf24; }
  .bad { color: #f87171; }
  .na { color: #64748b; }
  .sub { font-size: 0.82rem; color: #94a3b8; margin-top: 6px; }
  .section-title { margin: 0 0 12px; font-size: 1rem; color: #cbd5e1; }
  .finding {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(148,163,184,0.08);
    font-size: 0.92rem;
    word-break: break-word;
  }
  .sev { font-weight: 700; }
  .CRITICAL { color: #f87171; }
  .HIGH { color: #fb923c; }
  .MEDIUM { color: #fbbf24; }
  .LOW { color: #4ade80; }
  .INFO { color: #94a3b8; }
  .muted { color: #94a3b8; }
  .error {
    color: #f87171;
    background: rgba(127,29,29,0.18);
    border: 1px solid rgba(248,113,113,0.25);
    border-radius: 12px;
    padding: 14px;
    white-space: pre-wrap;
  }
  .loading { color: #94a3b8; padding: 24px 0; }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .chart-box { height: 260px; }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    color: #e2e8f0;
    border: 1px solid rgba(148,163,184,0.18);
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 92vw;
    z-index: 999;
    display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .toast.show { display: block; }
  .toast.success { border-color: #16a34a; }
  .toast.error { border-color: #dc2626; }

  @media (max-width: 900px) {
    .scores, .grid2 { grid-template-columns: 1fr; }
    .chart-box { height: 220px; }
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="fallback-logo" id="fallbackLogo">
  <div>
    <div class="big">RADOSLAV</div>
    <span class="small">ČORNANIČ</span>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>🔍 ForensicSuite Dashboard</h1>
    <p id="subtitle">v1.1.0 – stabilná základná verzia</p>
  </header>

  <div class="langbar" id="langbar"></div>

  <div class="toolbar">
    <button class="primary" id="btnScan">Spustiť sken</button>
    <button class="success" id="btnFixDuplicates">Odstrániť duplicity</button>
    <button class="warning" id="btnDeadCode">Dead code</button>
    <button class="warning" id="btnDangerous">Nebezpečné príkazy</button>
    <button class="info" id="btnExportPDF">Export PDF</button>
    <button class="primary" id="btnPublishPyPI">Publikovať na PyPI</button>
    <button class="danger" id="btnReset">Reset</button>
  </div>

  <div class="panel" id="statusPanel">
    <div class="loading" id="loading">Načítavam report.json...</div>
  </div>

  <div class="panel" id="scorePanel" style="display:none;">
    <h2 class="section-title" data-i18n="scoresTitle">Skóre</h2>
    <div class="scores" id="scores"></div>
  </div>

  <div class="grid2" id="chartsRow" style="display:none;">
    <div class="panel">
      <h2 class="section-title" data-i18n="radarTitle">Radar skóre</h2>
      <div class="chart-box"><canvas id="radarChart"></canvas></div>
    </div>
    <div class="panel">
      <h2 class="section-title" data-i18n="severityTitle">Severity</h2>
      <div class="chart-box"><canvas id="severityChart"></canvas></div>
    </div>
  </div>

  <div class="panel" id="findingsPanel" style="display:none;">
    <h2 class="section-title" data-i18n="findingsTitle">Nálezy</h2>
    <div id="findingsList"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const bg = document.getElementById('bg');
const fallbackLogo = document.getElementById('fallbackLogo');
const loading = document.getElementById('loading');
const scorePanel = document.getElementById('scorePanel');
const chartsRow = document.getElementById('chartsRow');
const findingsPanel = document.getElementById('findingsPanel');
const scoresEl = document.getElementById('scores');
const findingsEl = document.getElementById('findingsList');
const statusPanel = document.getElementById('statusPanel');
const subtitle = document.getElementById('subtitle');
const langbar = document.getElementById('langbar');
const toast = document.getElementById('toast');

let radarChart = null;
let severityChart = null;
let currentData = null;
let lang = 'sk';
let toastTimer = null;

const I18N = {
  sk: {
    subtitle: 'v1.1.0 – stabilná základná verzia',
    loading: 'Načítavam report.json...',
    scoresTitle: 'Skóre',
    radarTitle: 'Radar skóre',
    severityTitle: 'Severity',
    findingsTitle: 'Nálezy',
    noFindings: '✅ Žiadne nálezy',
    noValue: 'bez hodnoty',
    scoreLabel: '/ 100',
    langs: { sk: 'SK', en: 'EN', ru: 'RU', de: 'DE' },
    buttons: {
      scan: 'Spustiť sken',
      dup: 'Odstrániť duplicity',
      dead: 'Dead code',
      dangerous: 'Nebezpečné príkazy',
      pdf: 'Export PDF',
      pypi: 'Publikovať na PyPI',
      reset: 'Reset'
    },
    toasts: {
      scanning: '⏳ Spúšťam sken...',
      scanOk: '✅ Sken dokončený!',
      scanFail: '❌ Sken zlyhal',
      dupOk: '✅ Duplicity spracované',
      pdfOk: '✅ PDF pripravený',
      resetOk: '🗑️ Reset...',
      apiErr: '❌ Chyba API'
    }
  },
  en: {
    subtitle: 'v1.1.0 – stable base version',
    loading: 'Loading report.json...',
    scoresTitle: 'Scores',
    radarTitle: 'Radar score',
    severityTitle: 'Severity',
    findingsTitle: 'Findings',
    noFindings: '✅ No findings',
    noValue: 'no value',
    scoreLabel: '/ 100',
    langs: { sk: 'SK', en: 'EN', ru: 'RU', de: 'DE' },
    buttons: {
      scan: 'Run scan',
      dup: 'Remove duplicates',
      dead: 'Dead code',
      dangerous: 'Dangerous commands',
      pdf: 'Export PDF',
      pypi: 'Publish to PyPI',
      reset: 'Reset'
    },
    toasts: {
      scanning: '⏳ Running scan...',
      scanOk: '✅ Scan finished!',
      scanFail: '❌ Scan failed',
      dupOk: '✅ Duplicates handled',
      pdfOk: '✅ PDF ready',
      resetOk: '🗑️ Reset...',
      apiErr: '❌ API error'
    }
  },
  ru: {
    subtitle: 'v1.1.0 – стабильная базовая версия',
    loading: 'Загрузка report.json...',
    scoresTitle: 'Оценки',
    radarTitle: 'Радар оценок',
    severityTitle: 'Severity',
    findingsTitle: 'Результаты',
    noFindings: '✅ Ничего не найдено',
    noValue: 'нет значения',
    scoreLabel: '/ 100',
    langs: { sk: 'СК', en: 'АНГ', ru: 'РУС', de: 'НЕМ' },
    buttons: {
      scan: 'Запустить скан',
      dup: 'Удалить дубликаты',
      dead: 'Dead code',
      dangerous: 'Опасные команды',
      pdf: 'Экспорт PDF',
      pypi: 'Опубликовать в PyPI',
      reset: 'Сброс'
    },
    toasts: {
      scanning: '⏳ Запускаю скан...',
      scanOk: '✅ Скан завершён!',
      scanFail: '❌ Скан не удался',
      dupOk: '✅ Дубликаты обработаны',
      pdfOk: '✅ PDF готов',
      resetOk: '🗑️ Сброс...',
      apiErr: '❌ Ошибка API'
    }
  },
  de: {
    subtitle: 'v1.1.0 – stabile Basisversion',
    loading: 'Lade report.json...',
    scoresTitle: 'Werte',
    radarTitle: 'Radarwert',
    severityTitle: 'Severity',
    findingsTitle: 'Befunde',
    noFindings: '✅ Keine Befunde',
    noValue: 'kein Wert',
    scoreLabel: '/ 100',
    langs: { sk: 'SK', en: 'EN', ru: 'RU', de: 'DE' },
    buttons: {
      scan: 'Scan starten',
      dup: 'Duplikate entfernen',
      dead: 'Dead code',
      dangerous: 'Gefährliche Befehle',
      pdf: 'PDF exportieren',
      pypi: 'Auf PyPI veröffentlichen',
      reset: 'Reset'
    },
    toasts: {
      scanning: '⏳ Scan wird gestartet...',
      scanOk: '✅ Scan abgeschlossen!',
      scanFail: '❌ Scan fehlgeschlagen',
      dupOk: '✅ Duplikate verarbeitet',
      pdfOk: '✅ PDF bereit',
      resetOk: '🗑️ Reset...',
      apiErr: '❌ API-Fehler'
    }
  }
};

function t(path) {
  return path.split('.').reduce((o, k) => o && o[k], I18N[lang]) || path;
}

function showToast(msg, type = '', ms = 2600) {
  toast.className = 'toast show ' + type;
  toast.textContent = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.className = 'toast', ms);
}

function applyTexts() {
  subtitle.textContent = t('subtitle');
  loading.textContent = t('loading');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  renderLangBar();
  renderButtons();
}

function renderLangBar() {
  const labels = t('langs');
  langbar.innerHTML = Object.keys(labels).map(k =>
    `<button class="${k === lang ? 'active' : ''}" data-lang="${k}">${labels[k]}</button>`
  ).join('');
  langbar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      applyTexts();
      if (currentData) renderAll(currentData);
    });
  });
}

function renderButtons() {
  const map = {
    btnScan: 'buttons.scan',
    btnFixDuplicates: 'buttons.dup',
    btnDeadCode: 'buttons.dead',
    btnDangerous: 'buttons.dangerous',
    btnExportPDF: 'buttons.pdf',
    btnPublishPyPI: 'buttons.pypi',
    btnReset: 'buttons.reset'
  };
  for (const [id, key] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el) el.textContent = t(key);
  }
}

function setFallbackIfNeeded() {
  const img = new Image();
  img.onerror = () => {
    bg.style.display = 'none';
    fallbackLogo.style.display = 'flex';
  };
  img.src = 'assets/logo-bg.png?t=' + Date.now();
}

function scoreClass(v) {
  if (v === null || v === undefined) return 'na';
  if (v >= 80) return 'good';
  if (v >= 50) return 'warn';
  return 'bad';
}

function safeNum(v) {
  return typeof v === 'number' ? v : null;
}

function scoreLabel(key) {
  const labels = {
    sk: { maintainability: 'Udržateľnosť', architecture: 'Architektúra', security: 'Bezpečnosť' },
    en: { maintainability: 'Maintainability', architecture: 'Architecture', security: 'Security' },
    ru: { maintainability: 'Поддерживаемость', architecture: 'Архитектура', security: 'Безопасность' },
    de: { maintainability: 'Wartbarkeit', architecture: 'Architektur', security: 'Sicherheit' }
  };
  return labels[lang][key] || key;
}

function renderScores(data) {
  const s = data.scores || {};
  const items = ['maintainability', 'architecture', 'security'];
  scoresEl.innerHTML = '';
  for (const key of items) {
    const val = safeNum(s[key] && s[key].score);
    const cls = scoreClass(val);
    scoresEl.innerHTML += `
      <div class="score-card">
        <h3>${scoreLabel(key)}</h3>
        <div class="score-value ${cls}">${val === null ? 'N/A' : val}</div>
        <div class="sub">${val === null ? t('noValue') : t('scoreLabel')}</div>
      </div>
    `;
  }
}

function renderFindings(data) {
  const findings = Array.isArray(data.findings) ? data.findings : [];
  if (findings.length === 0) {
    findingsEl.innerHTML = '<div class="finding muted">' + t('noFindings') + '</div>';
    return;
  }
  findingsEl.innerHTML = findings.slice(0, 120).map(f => {
    const sev = f.severity || 'INFO';
    const msg = f.message || 'Bez správy';
    const loc = f.location ? ` <span class="muted">– ${f.location}</span>` : '';
    return `<div class="finding"><span class="sev ${sev}">[${sev}]</span> ${msg}${loc}</div>`;
  }).join('');
  if (findings.length > 120) {
    findingsEl.innerHTML += `<div class="finding muted">... a ďalších ${findings.length - 120} nálezov</div>`;
  }
}

function renderCharts(data) {
  if (typeof Chart === 'undefined') return;

  const s = data.scores || {};
  const radarData = [
    safeNum(s.maintainability && s.maintainability.score),
    safeNum(s.architecture && s.architecture.score),
    safeNum(s.security && s.security.score),
  ];

  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById('radarChart').getContext('2d'), {
    type: 'radar',
    data: {
      labels: [scoreLabel('maintainability'), scoreLabel('architecture'), scoreLabel('security')],
      datasets: [{
        label: 'Skóre',
        data: radarData.map(v => v === null ? 0 : v),
        backgroundColor: 'rgba(96,165,250,0.18)',
        borderColor: 'rgba(96,165,250,1)',
        pointBackgroundColor: 'rgba(96,165,250,1)',
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0,
          max: 100,
          ticks: { color: '#94a3b8', stepSize: 20 },
          grid: { color: '#334155' },
          angleLines: { color: '#334155' }
        }
      },
      plugins: { legend: { labels: { color: '#e2e8f0' } } }
    }
  });

  const findings = Array.isArray(data.findings) ? data.findings : [];
  const count = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
  for (const f of findings) {
    const sev = (f && f.severity) ? f.severity : 'INFO';
    if (count[sev] !== undefined) count[sev]++;
  }

  if (severityChart) severityChart.destroy();
  severityChart = new Chart(document.getElementById('severityChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: Object.keys(count),
      datasets: [{
        label: 'Počet nálezov',
        data: Object.values(count),
        backgroundColor: ['#f87171','#fb923c','#fbbf24','#4ade80','#94a3b8']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { color: '#94a3b8', precision: 0 }, grid: { color: '#334155' } }
      }
    }
  });
}

function showError(msg) {
  loading.innerHTML = '<div class="error">' + msg + '</div>';
  statusPanel.style.display = 'block';
}

function renderAll(data) {
  currentData = data;
  renderScores(data);
  renderFindings(data);
  renderCharts(data);
  loading.style.display = 'none';
  statusPanel.style.display = 'none';
  scorePanel.style.display = 'block';
  chartsRow.style.display = 'grid';
  findingsPanel.style.display = 'block';
}

async function loadReport() {
  try {
    const r = await fetch('report.json?t=' + Date.now());
    if (!r.ok) throw new Error('report.json sa nenašiel');
    const data = await r.json();
    renderAll(data);
  } catch (e) {
    showError(t('loading') + '
' + e.message);
  }
}

async function callApi(endpoint, method = 'GET', data = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (data) opts.body = JSON.stringify(data);
    const r = await fetch('http://localhost:8765' + endpoint, opts);
    return await r.json();
  } catch (e) {
    showToast(t('toasts.apiErr') + ': ' + e.message, 'error');
    return null;
  }
}

document.getElementById('btnScan').addEventListener('click', async () => {
  showToast(t('toasts.scanning'), '', 3000);
  const result = await callApi('/scan', 'POST', { path: '.', formats: ['json'] });
  if (result && result.status === 'ok') {
    showToast(t('toasts.scanOk'), 'success');
    setTimeout(loadReport, 800);
  } else {
    showToast(t('toasts.scanFail') + ': ' + (result?.error || 'neznáma chyba'), 'error', 4000);
  }
});

document.getElementById('btnFixDuplicates').addEventListener('click', async () => {
  const result = await callApi('/fix/duplicates', 'POST');
  if (result && result.status === 'ok') {
    showToast(t('toasts.dupOk'), 'success');
    setTimeout(loadReport, 800);
  }
});

document.getElementById('btnDeadCode').addEventListener('click', async () => {
  const result = await callApi('/fix/deadcode', 'POST');
  if (result && result.status === 'ok') {
    const msg = result.suggestions && result.suggestions.length
      ? result.suggestions.map(s => `${s.function} (${s.path}:${s.lineno})`).join('
')
      : 'Žiadny dead code.';
    alert(msg);
  }
});

document.getElementById('btnDangerous').addEventListener('click', async () => {
  const result = await callApi('/fix/dangerous', 'POST');
  if (result && result.status === 'ok') {
    const msg = result.suggestions && result.suggestions.length
      ? result.suggestions.map(s => `[${s.type}] ${s.content} (${s.file}:${s.line})`).join('
')
      : 'Žiadne nebezpečné príkazy.';
    alert(msg);
  }
});

document.getElementById('btnExportPDF').addEventListener('click', async () => {
  const result = await callApi('/export/pdf', 'POST');
  if (result && result.status === 'ok') {
    showToast(t('toasts.pdfOk') + ': ' + result.path, 'success', 4000);
  }
});

document.getElementById('btnPublishPyPI').addEventListener('click', async () => {
  const token = prompt('PyPI token:');
  if (!token) return;
  const result = await callApi('/publish/pypi', 'POST', { token });
  if (result && result.status === 'ok') {
    showToast('✅ PyPI publikované', 'success', 4000);
  } else {
    showToast('❌ ' + (result?.error || 'neznáma chyba'), 'error', 4000);
  }
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Naozaj reset?')) {
    showToast(t('toasts.resetOk'), '', 2000);
    setTimeout(loadReport, 500);
  }
});

setFallbackIfNeeded();
renderLangBar();
renderButtons();
applyTexts();
loadReport();
</script>
</body>
</html>
